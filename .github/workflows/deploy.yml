name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Deploy attempt ${attempt}/3"
            if npx vercel@latest --prod --token="${{ secrets.VERCEL_TOKEN }}" --yes; then
              exit 0
            fi

            if [ "${attempt}" -lt 3 ]; then
              echo "Vercel deploy failed (attempt ${attempt}). Retrying in 15 seconds..."
              sleep 15
            fi
          done

          echo "Vercel deployment failed after 3 attempts."
          exit 1
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
